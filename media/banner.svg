<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="PoppingMango Sources — Novels, Manga, Manhwa and Manhua for Paperback 0.9">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0f16"/>
      <stop offset="0.55" stop-color="#170d13"/>
      <stop offset="1" stop-color="#101a10"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb144"/>
      <stop offset="0.55" stop-color="#f7a340"/>
      <stop offset="1" stop-color="#9bc153"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9c9d8"/>
      <stop offset="0.45" stop-color="#ffb144"/>
      <stop offset="1" stop-color="#9bc153"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f9c9d8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f9c9d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMango" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb144" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffb144" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9bc153" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#9bc153" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="296" rx="26" fill="url(#bg)" stroke="#f9c9d8" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="120" cy="40" r="190" fill="url(#glowPink)"/>
  <circle cx="1080" cy="90" r="220" fill="url(#glowMango)"/>
  <circle cx="620" cy="310" r="240" fill="url(#glowGreen)"/>

  <g transform="translate(150,150)">
    <circle r="78" fill="#f9c9d8"/>
    <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <g transform="rotate(-18)">
      <ellipse cx="0" cy="10" rx="34" ry="44" fill="url(#mango)"/>
      <ellipse cx="-10" cy="-2" rx="12" ry="18" fill="#ffffff" opacity="0.28"/>
      <path d="M2,-32 C4,-44 10,-50 16,-54" fill="none" stroke="#7a9a3c" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="26" cy="-52" rx="14" ry="7" fill="#9bc153" transform="rotate(24 26 -52)"/>
    </g>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="270" y="150" font-size="62" font-weight="800" fill="url(#title)">PoppingMango</text>
    <text x="750" y="150" font-size="62" font-weight="800" fill="#ffffff">Sources</text>
    <text x="270" y="205" font-size="25" font-weight="600" letter-spacing="4" fill="#f2d9e2">NOVELS · MANGA · MANHWA · MANHUA</text>
    <text x="270" y="245" font-size="21" font-weight="500" letter-spacing="2" fill="#b9a7b2">A HAND-BUILT SOURCE LIST FOR PAPERBACK 0.9</text>
  </g>
</svg>
