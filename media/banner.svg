<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="PoppingMango Sources — Novels, Manga, Manhwa and Manhua for Paperback 0.9">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b3cd"/>
      <stop offset="0.28" stop-color="#ef6fa5"/>
      <stop offset="0.58" stop-color="#e8629b"/>
      <stop offset="0.82" stop-color="#f0982e"/>
      <stop offset="1" stop-color="#8bb844"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d0f16" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#1d0f16" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb144"/>
      <stop offset="0.55" stop-color="#f7a340"/>
      <stop offset="1" stop-color="#9bc153"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="2" y="2" width="1196" height="296" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="300" fill="url(#brand)"/>
    <rect x="0" y="0" width="1200" height="300" fill="url(#scrim)"/>
    <ellipse cx="600" cy="-40" rx="700" ry="150" fill="#ffffff" opacity="0.12"/>
    <circle cx="1120" cy="255" r="200" fill="#2fb8cc" opacity="0.22"/>
    <circle cx="120" cy="30" r="260" fill="#f9c9d8" opacity="0.38"/>
  </g>
  <rect x="2" y="2" width="1196" height="296" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <g transform="translate(150,150)">
    <circle r="78" fill="#f9c9d8"/>
    <circle r="78" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="4"/>
    <g transform="rotate(-18)">
      <ellipse cx="0" cy="10" rx="34" ry="44" fill="url(#mango)"/>
      <ellipse cx="-10" cy="-2" rx="12" ry="18" fill="#ffffff" opacity="0.28"/>
      <path d="M2,-32 C4,-44 10,-50 16,-54" fill="none" stroke="#7a9a3c" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="26" cy="-52" rx="14" ry="7" fill="#9bc153" transform="rotate(24 26 -52)"/>
    </g>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="270" y="150" font-size="64" font-weight="800">PoppingMango Sources</text>
    <text x="272" y="205" font-size="25" font-weight="700" letter-spacing="4" opacity="0.95">NOVELS · MANGA · MANHWA · MANHUA</text>
    <text x="272" y="245" font-size="21" font-weight="600" letter-spacing="2" opacity="0.9">MAINTAINED BY POPMANGO</text>
  </g>
</svg>
