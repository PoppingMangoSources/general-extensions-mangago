    <path d="M0,-96 23.5,-72.3 56.4,-77.7 61.5,-44.7 91.3,-29.7 76,0 91.3,29.7 61.5,44.7 56.4,77.7 23.5,72.3 0,96 -23.5,72.3 -56.4,77.7 -61.5,44.7 -91.3,29.7 -76,0 -91.3,-29.7 -61.5,-44.7 -56.4,-77.7 -23.5,-72.3 Z" fill="#ffffff" opacity="0.55"/>
