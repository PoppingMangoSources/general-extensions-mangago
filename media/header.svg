<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="PoppingMango Sources — Novels, Manga, Manhwa and Manhua for Paperback 0.9">
  <defs>
