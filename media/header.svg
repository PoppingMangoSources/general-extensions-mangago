      <stop offset="0" stop-color="#ffb8d6"/>
      <stop offset="0.34" stop-color="#f47fb2"/>
      <stop offset="0.74" stop-color="#ea5b93"/>
      <stop offset="0.9" stop-color="#f26f8e"/>
