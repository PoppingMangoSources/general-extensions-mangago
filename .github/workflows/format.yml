name: Format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format files
        run: npx oxfmt . '!bundles/**' '!.github/workflows/**'

      - name: Commit formatted files
        run: |
          git config user.name "Popmango Extensions"
          git config user.email "297959108+PoppingMangoSources@users.noreply.github.com"
          git add --all -- . ':(exclude).github/workflows/**'
          if ! git diff --cached --quiet; then
            git -c commit.gpgsign=false commit --no-gpg-sign -m "style: format repository files" -m "Apply repository formatting."
            git push
          fi
