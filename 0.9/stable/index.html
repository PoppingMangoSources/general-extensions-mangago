<!doctype html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex" />
    <meta name="description" content="Novels, manga, manhwa & manhua for Paperback 0.9 — maintained by Popmango." />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2232%22%20fill%3D%22%23ffe3ee%22%2F%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2235%22%20rx%3D%2215%22%20ry%3D%2219%22%20fill%3D%22%23ff9f52%22%2F%3E%3Cpath%20d%3D%22M33%2014%20q3%20-6%209%20-8%22%20fill%3D%22none%22%20stroke%3D%22%238fb648%22%20stroke-width%3D%224%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2214%22%20r%3D%225%22%20fill%3D%22%23f277a8%22%2F%3E%3C%2Fsvg%3E" />
    <title>General Extensions (0.9)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
      /* One palette drives every rule below, so a colour is changed in a single
         place rather than hunted through the sheet. */
      :root {
        --pm-bg: #17101f;
        --pm-surface: #241729;
        --pm-surface-2: #2b1c33;
        --pm-surface-hover: #33203c;
        --pm-border: #3d2545;
        --pm-ink: #fbeaf4;
        --pm-ink-soft: #bda3c0;
        --pm-ink-faint: #9b83a2;
        --pm-rose: #ff5f9e;
        --pm-rose-deep: #d63a78;
        --pm-mango: #ffa45c;
        /* The pastel run the readme art and the install button share. */
        --pm-pastel: linear-gradient(100deg, #ffdcea 0%, #ffbbd5 34%, #ffcda8 70%, #ffc17e 100%);
        --pm-on-pastel: #33162a;
      }

      html {
        /* The colour matters as much as the gradient: Safari paints the status
           bar and the overscroll area from the root's background COLOUR, and a
           gradient alone leaves it nothing to resolve, so those strips come out
           white. Setting the first stop as the colour makes them continuous
           with the top of the page. */
        background-color: var(--pm-bg) !important;
        background-image: linear-gradient(180deg, #1d1327 0%, #17101f 58%, #1b1124 100%) !important;
        background-repeat: no-repeat !important;
        min-height: 100%;
        overflow-y: scroll;
      }
      body {
        background: transparent !important;
        color: var(--pm-ink) !important;
        min-height: 100vh;
        scrollbar-gutter: stable;
      }
      ::selection { background: rgba(255, 95, 158, 0.3); color: var(--pm-ink); }
      a { color: var(--pm-rose); }

      /* Bright against the dark page, and the same run the artwork uses. */
      h1 {
        background: var(--pm-pastel);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent !important;
      }

      /* Both install buttons carry the pastel gradient with dark text on it,
         matching the add button in the readme. On a dark page that reads far
         better than white-on-saturated, which cannot clear 3:1 at the warm end
         of this run. */
      .addToPaperbackButton,
      .bg-\[\#c9376b\] {
        background: var(--pm-pastel) !important;
        border-bottom-color: rgba(23, 16, 31, 0.35) !important;
        box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4) !important;
        color: var(--pm-on-pastel) !important;
        font-weight: 700;
      }
      .hover\:bg-\[\#f47fb2\]:hover {
        background: linear-gradient(100deg, #ffe7f1 0%, #ffc9de 34%, #ffd9bb 70%, #ffcd96 100%) !important;
      }
      .bg-\[\#c9376b\] svg { color: var(--pm-on-pastel) !important; }

      .bg-zinc-700 { background-color: var(--pm-surface-2) !important; }
      .hover\:bg-zinc-600:hover { background-color: var(--pm-surface-hover) !important; }
      .bg-gray-500 { background-color: var(--pm-border) !important; }
      .border-zinc-700 { border-color: var(--pm-border) !important; }
      .text-gray-100, .text-gray-200, .text-gray-300 { color: var(--pm-ink) !important; }
      .text-gray-400 { color: var(--pm-ink-soft) !important; }
      .placeholder-gray-400::placeholder { color: var(--pm-ink-faint) !important; }

      /* Source cards: a lifted surface with a rose edge on hover, rather than a
         flat block. */
      .bg-zinc-800 {
        background: linear-gradient(165deg, var(--pm-surface-2) 0%, var(--pm-surface) 100%) !important;
      }
      .bg-zinc-800.rounded-lg { border: 1px solid var(--pm-border) !important; }
      .bg-zinc-800.rounded-lg:hover {
        background: linear-gradient(165deg, var(--pm-surface-hover) 0%, var(--pm-surface-2) 100%) !important;
        border-color: var(--pm-rose) !important;
      }
      .shadow-lg { box-shadow: 0 10px 26px rgba(0, 0, 0, 0.38) !important; }

      /* Badge chips are filled from each extension's own colour and drawn at a
         quarter opacity when unselected, so only the label is set here — light,
         which holds against both the dim unselected tint and the full fill. */
      .font-medium.transition-all { color: var(--pm-ink) !important; }

      /* bg-red-500 backs both the ADULT pill and the error panel, and those
         carry different label colours, so the pill is matched on the pair.
         The pills are translucent so they tint the card they sit on instead of
         covering it with a second opaque block. */
      .bg-red-500 { background-color: var(--pm-rose-deep) !important; }
      .text-red-500 { color: var(--pm-rose-deep) !important; }
      .bg-red-500.text-red-100 { background-color: rgba(255, 95, 158, 0.2) !important; color: #ffb3cf !important; }
      .bg-yellow-500.text-yellow-900 { background-color: rgba(255, 164, 92, 0.2) !important; color: #ffd79a !important; }
      .bg-green-500.text-green-100 { background-color: rgba(122, 200, 140, 0.2) !important; color: #a8e0c0 !important; }
      .border-red-700 { border-color: rgba(23, 16, 31, 0.35) !important; }
    </style>
  </head>

  <body
    class="bg-[#1b1b1f] text-gray-200 font-[Inter] p-4 md:p-8 lg:p-12 text-center"
    x-data="repositoryData()"
    x-init="await initialize()"
  >
    <div class="container mx-auto max-w-7xl">
      <header class="flex flex-col items-center relative mt-4">
        <div
          class="absolute w-28 h-28 md:w-40 md:h-40 -top-4 left-1/2 -translate-x-1/2 rounded-full"
          style="
            background:
              radial-gradient(
                circle at 30% 30%,
                rgba(255, 255, 255, 0.6) 0%,
                transparent 70%
              ),
              radial-gradient(
                circle at 70% 70%,
                rgba(255, 255, 255, 0.35) 0%,
                transparent 70%
              );
            filter: blur(25px);
          "
        ></div>
        <div class="relative z-10">
          <img
            class="md:max-h-32 max-h-20 rounded-lg"
            src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22128%22%20height%3D%22128%22%20viewBox%3D%220%200%20128%20128%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffdcea%22%2F%3E%3Cstop%20offset%3D%220.42%22%20stop-color%3D%22%23ffbbd5%22%2F%3E%3Cstop%20offset%3D%220.76%22%20stop-color%3D%22%23ffcda8%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ffc17e%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22m%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23ffc98a%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ffa45c%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%22128%22%20height%3D%22128%22%20rx%3D%2230%22%20fill%3D%22url(%23g)%22%2F%3E%3Ccircle%20cx%3D%2238%22%20cy%3D%2228%22%20r%3D%2211%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.55%22%2F%3E%3Ccircle%20cx%3D%2234%22%20cy%3D%2224%22%20r%3D%223.5%22%20fill%3D%22%23ffffff%22%2F%3E%3Ccircle%20cx%3D%22100%22%20cy%3D%2298%22%20r%3D%2215%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.4%22%2F%3E%3Ccircle%20cx%3D%22103%22%20cy%3D%2234%22%20r%3D%226%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.5%22%2F%3E%3Cg%20transform%3D%22translate(64%2C74)%20rotate(-16)%22%3E%3Cellipse%20cx%3D%220%22%20cy%3D%224%22%20rx%3D%2223%22%20ry%3D%2229%22%20fill%3D%22url(%23m)%22%2F%3E%3Cellipse%20cx%3D%22-7%22%20cy%3D%22-3%22%20rx%3D%227%22%20ry%3D%2211%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.38%22%2F%3E%3Ccircle%20cx%3D%22-9%22%20cy%3D%2215%22%20r%3D%223.5%22%20fill%3D%22%23ffffff%22%20opacity%3D%220.5%22%2F%3E%3Cpath%20d%3D%22M1%2C-22%20C3%2C-30%206%2C-35%2011%2C-38%22%20fill%3D%22none%22%20stroke%3D%22%23a8d48c%22%20stroke-width%3D%224.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cellipse%20cx%3D%2218%22%20cy%3D%22-36%22%20rx%3D%2210%22%20ry%3D%225%22%20fill%3D%22%23bde3a4%22%20transform%3D%22rotate(24%2018%20-36)%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E"
            alt="Repository logo"
          />
        </div>

        <h1
          x-show="repository"
          x-text="repository?.name"
          class="text-xl mt-4 md:text-3xl font-bold"
        ></h1>

        <p
          x-show="repository"
          x-text="repository?.description"
          class="mt-4 text-center"
        ></p>

        <a
          class="addToPaperbackButton inline-block leading-7 mt-4 mx-1 py-2 px-4 text-white bg-[#c9376b] border-b border-red-700 rounded-full transition-colors duration-100 hover:bg-[#e0517f] hover:cursor-pointer"
          @click="addToPaperback()"
          x-show="repository"
        >
          Add Repository to Paperback
        </a>
      </header>

      <div class="mx-auto text-left">
        <!-- Error message -->
        <div
          x-show="error"
          class="bg-red-500 text-white p-4 rounded-lg mt-6 text-center"
        >
          <p class="font-bold">Error loading repository data</p>
          <p x-text="error" class="mt-2"></p>
          <button
            @click="initialize()"
            class="mt-2 bg-white text-red-500 px-4 py-1 rounded-lg"
          >
            Retry
          </button>
        </div>

        <div class="mt-6 space-y-4" x-show="!error">
          <div x-show="repository" class="relative">
            <label
              for="source-search"
              class="block text-sm font-medium text-gray-400"
            >
              Search
            </label>
            <input
              type="text"
              id="source-search"
              x-model="searchTerm"
              placeholder="Search sources..."
              class="w-full px-4 py-2 bg-zinc-800 border border-zinc-700 rounded-lg text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#c9376b]"
            />
          </div>

          <!-- Badge filters -->
          <div x-show="repository" class="relative">
            <div class="overflow-x-auto" x-show="availableBadges.length">
              <label
                id="badge-filter-label"
                class="block text-sm font-medium text-gray-400 mb-2"
              >
                Filter
              </label>
              <div
                class="inline-flex gap-2 pb-2"
                role="group"
                aria-labelledby="badge-filter-label"
              >
                <template x-for="badge in availableBadges" :key="badge.label">
                  <button
                    @click="toggleBadgeFilter(badge)"
                    class="px-3 py-2 rounded-lg text-md font-medium transition-all duration-200 shrink-0 hover:cursor-pointer"
                    :style="selectedBadges.some(b => b.label === badge.label) ?
                            `background-color: ${badge.backgroundColor}; color: ${badge.textColor};` :
                            `background-color: ${badge.backgroundColor + '40'}; color: ${badge.textColor};`"
                    x-text="badge.label"
                  ></button>
                </template>
              </div>
            </div>
          </div>

          <!-- Sort controls -->
          <div
            x-show="repository"
            class="flex justify-between items-center flex-wrap gap-3"
          >
            <div>
              <p class="font-bold">Available Sources:</p>
              <p class="text-sm text-gray-400">
                Click on sources to select them for installation
              </p>
            </div>
          </div>

          <div
            x-show="repository"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
          >
            <template x-for="source in filteredSources" :key="source.id">
              <div
                @click="toggleSource(source.id)"
                class="bg-zinc-800 rounded-lg shadow-lg overflow-hidden hover:cursor-pointer transition-all duration-200 relative"
                :class="selectedSources.has(source.id) ? 'ring-2 ring-[#c9376b]' : ''"
                @keydown.enter="toggleSource(source.id)"
                tabindex="0"
              >
                <!-- Desktop Layout -->
                <div class="hidden md:block">
                  <div class="p-4 flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                      <img
                        :src="`${baseUrl}/${source.id}/static/${source.icon}`"
                        :alt="`${source.name} icon`"
                        class="w-12 h-12 rounded-full"
                        loading="lazy"
                        onerror="
                          this.src = 'https://paperback.moe/pb-placeholder.png'
                          this.onerror = ''
                        "
                      />
                      <h3
                        class="text-xl font-semibold text-gray-200"
                        x-text="source.name"
                      ></h3>
                    </div>
                    <span
                      class="px-2 py-1 rounded text-xs font-semibold"
                      :class="getContentRatingClass(source.contentRating)"
                      x-text="source.contentRating"
                    ></span>
                  </div>
                  <div class="p-4 border-t border-zinc-700">
                    <p class="text-gray-300 text-sm mb-2">
                      Version: <span x-text="source.version"></span>
                    </p>
                    <p
                      class="text-gray-300 mb-4 line-clamp-2 min-h-[3rem]"
                      x-text="source.description"
                    ></p>
                  </div>
                  <div class="p-4 pt-0">
                    <div
                      class="flex flex-nowrap gap-2 overflow-x-auto pb-2"
                      x-show="source.badges && source.badges.length"
                    >
                      <template
                        x-for="badge in sortBadges(source.badges)"
                        :key="badge.label"
                      >
                        <span
                          class="px-2 py-0.5 rounded text-xs font-medium whitespace-nowrap shrink-0 transition-all duration-200"
                          :style="selectedBadges.some(b => b.label === badge.label) ?
                                  `background-color: ${badge.backgroundColor}; color: ${badge.textColor};` :
                                  `background-color: ${badge.backgroundColor + '40'}; color: ${badge.textColor};`"
                          x-text="badge.label"
                        ></span>
                      </template>
                    </div>
                    <div class="text-gray-400 text-sm flex items-center mt-2">
                      <span
                        x-show="selectedSources.has(source.id)"
                        class="text-[#c9376b] text-xs"
                        >• Selected</span
                      >
                    </div>
                  </div>
                </div>
                <!-- Mobile Layout -->
                <div class="md:hidden p-4">
                  <div class="flex items-start justify-between">
                    <div class="flex items-center space-x-3">
                      <img
                        :src="`${baseUrl}/${source.id}/static/${source.icon}`"
                        :alt="`${source.name} icon`"
                        class="w-12 h-12 rounded-full"
                        loading="lazy"
                        onerror="
                          this.src = 'https://paperback.moe/pb-placeholder.png'
                          this.onerror = ''
                        "
                      />
                      <div class="flex flex-col space-y-1">
                        <h3
                          class="text-lg font-semibold text-gray-200"
                          x-text="source.name"
                        ></h3>
                        <span
                          class="text-sm text-gray-400"
                          x-text="`v${source.version}`"
                        ></span>
                      </div>
                    </div>
                    <span
                      class="px-2 py-1 rounded text-xs font-semibold shrink-0"
                      :class="getContentRatingClass(source.contentRating)"
                      x-text="source.contentRating"
                    ></span>
                  </div>
                  <p
                    class="text-gray-300 text-sm mt-2 mb-4 line-clamp-2 min-h-[2.5rem]"
                    x-text="source.description"
                  ></p>
                  <div class="mt-2">
                    <div
                      class="flex flex-nowrap gap-2 overflow-x-auto pb-2"
                      x-show="source.badges && source.badges.length"
                    >
                      <template
                        x-for="badge in sortBadges(source.badges)"
                        :key="badge.label"
                      >
                        <span
                          class="px-2 py-1 rounded text-sm font-medium whitespace-nowrap shrink-0 transition-all duration-200"
                          :style="selectedBadges.some(b => b.label === badge.label) ?
                                  `background-color: ${badge.backgroundColor}; color: ${badge.textColor};` :
                                  `background-color: ${badge.backgroundColor + '40'}; color: ${badge.textColor};`"
                          x-text="badge.label"
                        ></span>
                      </template>
                    </div>
                    <span
                      x-show="selectedSources.has(source.id)"
                      class="text-[#c9376b] text-xs block mt-2"
                      >• Selected</span
                    >
                  </div>
                </div>
              </div>
            </template>
          </div>

          <!-- Empty state when no sources match filter -->
          <div
            x-show="repository && filteredSources.length === 0"
            class="p-10 text-center"
          >
            <p class="text-lg text-gray-400">
              No sources found matching your filters
            </p>
            <button
              @click="resetFilters()"
              class="mt-3 bg-zinc-700 hover:bg-zinc-600 text-white px-4 py-2 rounded-lg transition-colors"
            >
              Reset Filters
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Build Information Footer -->
    <footer
      class="mt-4 md:mt-12 text-center text-sm text-gray-400"
      x-show="buildInfo?.buildTime && buildInfo?.builtWith"
    >
      <div class="space-y-1">
        <p>
          Paperback Toolchain:
          <span x-text="buildInfo?.builtWith?.toolchain"></span>
        </p>
        <p>
          Paperback Types: <span x-text="buildInfo?.builtWith?.types"></span>
        </p>
        <p>
          Build Time:
          <span
            x-text="buildInfo?.buildTime ? new Date(buildInfo.buildTime).toLocaleString() : ''"
          >
          </span>
        </p>
      </div>
    </footer>

    <!-- Floating Install Button -->
    <div
      x-show="selectedSources.size > 0"
      class="fixed bottom-6 right-6 z-50"
      x-transition:enter="transition ease-out duration-200"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-150"
      x-transition:leave-start="opacity-100 translate-y-0"
      x-transition:leave-end="opacity-0 translate-y-4"
    >
      <button
        @click="installSelectedSources()"
        class="py-3 px-6 bg-[#c9376b] text-white rounded-full hover:bg-[#e0517f] transition-colors duration-100 shadow-lg hover:cursor-pointer flex items-center space-x-2"
      >
        <span>Install</span>
        <span
          class="bg-white/25 px-2 py-0.5 rounded-full text-sm"
          x-text="selectedSources.size"
        ></span>
      </button>
    </div>
  </body>

  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.data('repositoryData', () => ({
        baseUrl: window.location
          .toString()
          .replace('index.html', '')
          .replace(/\/$/, ''),
        repository: null,
        sources: [],
        selectedSources: new Set(),
        buildInfo: null,
        searchTerm: '',
        selectedBadges: [],
        availableBadges: [],
        error: null,

        get filteredSources() {
          return this.sources.filter((source) => {
            // Text search filter
            const matchesSearch =
              source.name
                .toLowerCase()
                .includes(this.searchTerm.toLowerCase()) ||
              source.description
                .toLowerCase()
                .includes(this.searchTerm.toLowerCase())

            // Badge filter
            const matchesBadges =
              this.selectedBadges.length === 0 ||
              this.selectedBadges.every((selectedBadge) =>
                source.badges?.some(
                  (badge) => badge.label === selectedBadge.label
                )
              )

            return matchesSearch && matchesBadges
          })
        },

        getCapabilityBadges(capabilities) {
          const badges = []
          const intents = {
            CHAPTER_PROVIDING: 1,
            PROGRESS_PROVIDING: 2,
            DISCOVER_SECTION_PROVIDING: 4,
            MANAGED_COLLECTION_PROVIDING: 8,
            CLOUDFLARE_BYPASS_PROVIDING: 16,
            SETTINGS_FORM_PROVIDING: 32,
            SEARCH_RESULT_PROVIDING: 64,
          }

          // Show badges for capabilities that can be user-facing
          const capabilityLabels = {
            MANGA_CHAPTERS: {
              label: 'Content Provider',
              textColor: '#FFFFFF',
              backgroundColor: '#4A90E2',
              type: 'capability',
            },
            MANGA_PROGRESS: {
              label: 'Tracker',
              textColor: '#FFFFFF',
              backgroundColor: '#50C878',
              type: 'capability',
            },
            COLLECTION_MANAGEMENT: {
              label: 'Collections Manager',
              textColor: '#FFFFFF',
              backgroundColor: '#E67E22',
              type: 'capability',
            },
            CLOUDFLARE_BYPASS: {
              label: 'Cloudflare',
              textColor: '#FFFFFF',
              backgroundColor: '#E74C3C',
              type: 'capability',
            },
          }

          // Handle both bit string and array formats
          const capabilityValues = Array.isArray(capabilities)
            ? capabilities
            : Object.entries(intents)
                .filter(([_, value]) => (capabilities & value) === value)
                .map(([_, value]) => value)

          for (const [key, value] of Object.entries(intents)) {
            if (capabilityValues.includes(value) && capabilityLabels[key]) {
              badges.push(capabilityLabels[key])
            }
          }

          return badges
        },

        async initialize() {
          try {
            this.error = null
            const response = await fetch(`${this.baseUrl}/versioning.json`)

            if (!response.ok) {
              throw new Error(
                `Failed to load repository data (${response.status})`
              )
            }

            const json = await response.json()
            this.repository = json.repository

            // Add capability badges to sources
            this.sources = json.sources.map((source) => ({
              ...source,
              badges: [
                ...this.getCapabilityBadges(source.capabilities),
                ...(source.badges || []),
              ],
            }))

            this.buildInfo = {
              buildTime: json.buildTime,
              builtWith: json.builtWith,
            }
            document.title = this.repository.name

            // Collect unique badges from all sources by label
            const badgeMap = new Map()
            this.sources.forEach((source) => {
              source.badges?.forEach((badge) => {
                // If we already have a badge with this label, use the first occurrence
                if (!badgeMap.has(badge.label)) {
                  badgeMap.set(badge.label, badge)
                }
              })
            })
            this.availableBadges = Array.from(badgeMap.values())
          } catch (err) {
            console.error('Error initializing repository data:', err)
            this.error = err.message || 'Failed to load repository data'
          }
        },

        resetFilters() {
          this.searchTerm = ''
          this.selectedBadges = []
        },

        toggleBadgeFilter(badge) {
          const index = this.selectedBadges.findIndex(
            (b) => b.label === badge.label
          )
          if (index === -1) {
            this.selectedBadges.push(badge)
          } else {
            this.selectedBadges.splice(index, 1)
          }
        },

        getContentRatingClass(rating) {
          const classes = {
            MATURE: 'bg-yellow-500 text-yellow-900',
            ADULT: 'bg-red-500 text-red-100',
            SAFE: 'bg-green-500 text-green-100',
          }
          return classes[rating.toUpperCase()] || 'bg-gray-500 text-gray-100'
        },

        toggleSource(sourceId) {
          if (this.selectedSources.has(sourceId)) {
            this.selectedSources.delete(sourceId)
          } else {
            this.selectedSources.add(sourceId)
          }
        },

        installSelectedSources() {
          if (this.selectedSources.size === 0) {
            alert('Please select at least one source')
            return
          }
          const sourcesToInstall = Array.from(this.selectedSources).map(
            (id) => [id, this.baseUrl]
          )
          window.location.href = `paperback://installExtensions?data=${btoa(
            JSON.stringify(sourcesToInstall)
          )}`
        },

        addToPaperback() {
          if (!this.repository) {
            alert('Versioning info is not loaded')
            return
          }
          window.location.href = `paperback://addRepo?displayName=${encodeURI(
            this.repository.name
          )}&url=${encodeURI(this.baseUrl)}`
        },

        sortBadges(badges) {
          return [...badges].sort((a, b) => {
            const aSelected = this.selectedBadges.some(
              (s) => s.label === a.label
            )
            const bSelected = this.selectedBadges.some(
              (s) => s.label === b.label
            )
            return bSelected - aSelected
          })
        },
      }))
    })
  </script>
